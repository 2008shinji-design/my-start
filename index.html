<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>My Start | Appleガジェット</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color-scheme:light dark;--bg:#f5f6f9;--panel:#fff;--ink:#202637;--muted:#677081;--line:#e8eaf0;--shadow:0 2px 12px rgba(22,29,49,.045)}
@media(prefers-color-scheme:dark){:root{--bg:#11151d;--panel:#1d232e;--ink:#f4f5f8;--muted:#abb5c7;--line:#333b4b;--shadow:none}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}main{max-width:1000px;margin:auto;padding:24px 19px 58px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:0 0 24px}h1{font-size:clamp(23px,4vw,32px);letter-spacing:.01em;margin:0}header small{color:var(--muted);font-size:12px}.search{margin:18px 0 18px}.search form{display:flex;gap:10px}.search input{flex:1;min-width:0;min-height:46px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:0 15px;font-size:16px;color:var(--ink)}.search button{border:0;border-radius:13px;padding:0 17px;background:#3b6dd8;color:white;font-weight:650;cursor:pointer}.links{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.tile{text-decoration:none;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:12px;min-height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;box-shadow:none;padding:8px 3px;transition:transform .1s,background .15s}.tile:hover{background:rgba(120,130,150,.08)}.tile:focus-visible{outline:2px solid #3b6dd8;outline-offset:2px}.tile:active{transform:scale(.97)}.tile img{width:28px;height:28px;object-fit:contain}.tile .fallback{width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:800;color:#697c9b}.tile span:last-child{font-size:12px;white-space:nowrap;text-overflow:ellipsis;max-width:100%;overflow:hidden}.note{font-size:12px;color:var(--muted);line-height:1.7;margin:26px 0 0}@media(min-width:700px){.links{grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}.tile{min-height:82px}.tile span:last-child{font-size:13px}}@media(max-width:340px){.links{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<main>
<header><div><h1>🍎 My Start</h1><small>ブックマーク・ランチャー</small></div><small>v1.2</small></header>
<div class="search"><form action="https://www.google.com/search" method="get" target="_self"><input aria-label="Google検索" name="q" placeholder="Googleで検索" autocomplete="off"><button type="submit">検索</button></form></div>
<div id="links" class="links"></div>
<p class="note">Chromeの新しいタブを自動的に置き換えるものではありません。</p>
</main>
<script>
const groups=[
 {name:'🤖 AI',links:[['ChatGPT','https://chatgpt.com/'],['Claude','https://claude.ai/'],['Gemini','https://gemini.google.com/'],['Copilot','https://copilot.microsoft.com/']]},
 {name:'✉️ Google・日常',links:[['Gmail','https://mail.google.com/'],['Google Drive','https://drive.google.com/'],['Google マップ','https://maps.google.com/'],['YouTube','https://www.youtube.com/']]},
 {name:'🛍️ 買い物・旅行',links:[['楽天市場','https://www.rakuten.co.jp/'],['Amazon','https://www.amazon.co.jp/'],['じゃらん','https://www.jalan.net/'],['えきねっと','https://www.eki-net.com/']]},
 {name:'📰 ニュース・趣味',links:[['Yahoo!ニュース','https://news.yahoo.co.jp/'],['Bloomberg','https://www.bloomberg.co.jp/'],['patagonia','https://www.patagonia.jp/'],['mont-bell','https://www.montbell.jp/']]}
];
const grid=document.getElementById('links');
for(const group of groups){for(const [label,url] of group.links){const a=document.createElement('a');a.className='tile';a.href=url;a.title=url;const icon=document.createElement('img');icon.loading='lazy';icon.alt='';icon.src='https://www.google.com/s2/favicons?domain='+encodeURIComponent(new URL(url).hostname)+'&sz=64';icon.onerror=()=>{icon.remove();const fallback=document.createElement('span');fallback.className='fallback';fallback.textContent=label[0];a.prepend(fallback)};const caption=document.createElement('span');caption.textContent=label;a.append(icon,caption);grid.appendChild(a)}}
</script>
</body>
</html>
